version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://telegram_user:telegram_pass@postgres:5432/telegram_multi_db
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - telegram_net

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=telegram_user
      - POSTGRES_PASSWORD=telegram_pass
      - POSTGRES_DB=telegram_multi_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - telegram_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - telegram_net

  worker:
    build: .
    command: python -m app.jobs.worker
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - telegram_net

volumes:
  postgres_data:
  redis_data:

networks:
  telegram_net:
