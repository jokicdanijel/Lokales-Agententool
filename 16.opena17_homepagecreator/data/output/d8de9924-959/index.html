<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Multi-Page Test</title>
    <meta name="description" content="Testing multiple pages">
    <meta name="keywords" content="">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #333; }
        header { background: #007bff; color: white; padding: 1rem 2rem; }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 1.5rem; font-weight: bold; }
        nav ul { list-style: none; display: flex; gap: 1.5rem; }
        nav a { color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 4px; transition: background 0.3s; }
        nav a:hover { background: rgba(255,255,255,0.2); }
        main { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; min-height: 60vh; }
        h1 { color: #007bff; margin-bottom: 1rem; }
        footer { background: #f8f9fa; padding: 2rem; text-align: center; margin-top: 3rem; border-top: 1px solid #dee2e6; }
        .tagline { color: rgba(255,255,255,0.9); font-size: 0.9rem; margin-top: 0.25rem; }
    </style>

</head>
<body>
    <header>
        <div class="header-content">
            <div>
                <div class="logo">Multi-Page Test</div>
                <div class="tagline">Testing multiple pages</div>
            </div>

        </div>
    </header>

    <main>
        <h1>Home</h1>
        <div class="content">
            <h2>Welcome</h2><p>Homepage content.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Multi-Page Test. Alle Rechte vorbehalten.</p>
    </footer>


</body>
</html>
