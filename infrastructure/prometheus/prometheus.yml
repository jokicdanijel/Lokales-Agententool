global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "elion-production"
    environment: "production"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "opena1"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["opena1:12344"]

  - job_name: "opena2"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["opena2:12345"]

  - job_name: "auth"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["auth:12370"]

  - job_name: "billing"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["billing:12371"]

  - job_name: "website"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["website:12372"]

  - job_name: "dashboard"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["dashboard:12349"]

  - job_name: "workflow"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["workflow:12368"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
