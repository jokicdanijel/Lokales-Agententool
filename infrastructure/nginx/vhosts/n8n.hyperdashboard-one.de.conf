# ============================================================================
# n8n.hyperdashboard-one.de (Universal vHost)
# - Fixes: domain routing currently hitting opena20 (GET works, POST=501)
# - Supports: Host upstream OR Docker upstream
# - Supports: self-signed TLS OR Let's Encrypt (choose cert paths)
# ============================================================================

# -----------------------------
# HTTP -> HTTPS redirect
# -----------------------------
server {
    listen 80;
    server_name n8n.hyperdashboard-one.de;
    return 301 https://$host$request_uri;
}

# -----------------------------
# HTTPS reverse proxy to n8n
# -----------------------------
server {
    listen 443 ssl http2;
    server_name n8n.hyperdashboard-one.de;

    # === TLS (CHOOSE ONE) ================================================
    # Option 1: Let's Encrypt (recommended for real "public")
    # ssl_certificate     /etc/letsencrypt/live/n8n.hyperdashboard-one.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/n8n.hyperdashboard-one.de/privkey.pem;

    # Option 2: Self-signed (debug only, curl -k)
    ssl_certificate     /etc/ssl/certs/n8n.hyperdashboard-one.de.crt;
    ssl_certificate_key /etc/ssl/private/n8n.hyperdashboard-one.de.key;

    # Optional hardening
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # n8n can receive bigger webhook payloads
    client_max_body_size 25m;

    # === UPSTREAM (CHOOSE ONE) ===========================================
    # Case A: n8n runs on host (YOUR CONFIRMED CASE)
    set $n8n_upstream "http://127.0.0.1:5678";

    # Case B: n8n runs in Docker and nginx can reach it by name (same network/DNS)
    # set $n8n_upstream "http://n8n:5678";

    # Case C: n8n runs on a different host/port
    # set $n8n_upstream "http://10.0.0.10:5678";

    location / {
        proxy_pass $n8n_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets for n8n UI
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # timeouts (webhooks may be slow)
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }
}
