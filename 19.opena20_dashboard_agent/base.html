<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenA3 - {% block title %}Dashboard{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== GLOBALE STILE ===== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ===== NAVIGATION BAR ===== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-wrap: wrap;
            gap: 20px;
        }

        .nav-brand {
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-brand:hover {
            opacity: 0.9;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s, border-bottom 0.3s;
            font-weight: 500;
            padding-bottom: 5px;
            border-bottom: 2px solid transparent;
        }

        .nav-links a:hover {
            opacity: 0.8;
            border-bottom: 2px solid rgba(255, 255, 255, 0.6);
        }

        .nav-links a.active {
            border-bottom: 2px solid rgba(255, 255, 255, 1);
        }

        /* ===== HEADER ===== */
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px 0;
        }

        header h1 {
            font-size: 3.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.95;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9em;
            opacity: 0.8;
        }

        /* ===== CARDS ===== */
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .card .status {
            font-size: 0.85em;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 10px;
            display: inline-block;
        }

        .status.online {
            background: #d4edda;
            color: #155724;
        }

        .status.offline {
            background: #f8d7da;
            color: #721c24;
        }

        /* ===== GRID LAYOUTS ===== */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        /* ===== FORMS & INPUTS ===== */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 0.95em;
        }

        input, textarea, select {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95em;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* ===== BUTTONS ===== */
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        button.secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* ===== ALERTS ===== */
        .alert {
            padding: 15px 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert .close {
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .alert .close:hover {
            opacity: 1;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            padding: 30px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 50px;
        }

        footer p {
            margin-bottom: 5px;
        }

        footer a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            transition: opacity 0.3s;
        }

        footer a:hover {
            opacity: 0.8;
        }

        /* ===== UTILITIES ===== */
        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .text-muted {
            color: #999;
            font-size: 0.9em;
        }

        .mt-20 {
            margin-top: 20px;
        }

        .mb-20 {
            margin-bottom: 20px;
        }

        .p-20 {
            padding: 20px;
        }

        .hidden {
            display: none;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-links {
                flex-direction: column;
                gap: 10px;
                width: 100%;
            }

            .nav-links a {
                display: block;
            }

            .dashboard,
            .tools-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 10px;
            }
        }

        /* ===== ANIMATIONS ===== */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        {% block custom_styles %}{% endblock %}
    </style>
</head>
<body>
    <!-- ===== NAVIGATION ===== -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">🤖 OpenA3</a>
        <div class="nav-links">
            <a href="index.html" class="nav-link" data-page="index">📊 Dashboard</a>
            <a href="tools.html" class="nav-link" data-page="tools">🛠️ Tools</a>
            <a href="#" onclick="alert('Dokumentation wird geladen...')" class="nav-link">📖 Docs</a>
            <a href="#" onclick="alert('Einstellungen werden geladen...')" class="nav-link">⚙️ Einstellungen</a>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="container">
        {% block content %}{% endblock %}

        <!-- ===== FOOTER ===== -->
        <footer>
            <p>&copy; 2025 OpenA3 - AI Agent Dashboard System</p>
            <p><small>Version 3.0 | <a href="#">Dokumentation</a> | <a href="#">Support</a> | <a href="#">GitHub</a></small></p>
        </footer>
    </div>

    <script>
        // ===== NAVIGATION AKTIVER LINK =====
        document.addEventListener('DOMContentLoaded', function() {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href').includes(currentPage)) {
                    link.classList.add('active');
                }
            });
        });

        // ===== ALERT SCHLIESSEN =====
        function closeAlert(element) {
            element.parentElement.remove();
        }

        // ===== API CALLS HELPER =====
        async function apiCall(endpoint, method = 'GET', data = null) {
            try {
                const options = {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    }
                };

                if (data) {
                    options.body = JSON.stringify(data);
                }

                const response = await fetch(`/api${endpoint}`, options);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        // ===== NOTIFICATION SYSTEM =====
        function showNotification(message, type = 'info') {
            const alert = document.createElement('div');
            alert.className = `alert ${type} fade-in`;
            alert.innerHTML = `
                <span>${message}</span>
                <span class="close" onclick="closeAlert(this)">×</span>
            `;

            const container = document.querySelector('.container');
            if (container) {
                container.insertBefore(alert, container.firstChild);

                setTimeout(() => {
                    alert.remove();
                }, 5000);
            }
        }

        {% block scripts %}{% endblock %}
    </script>
</body>
</html>
