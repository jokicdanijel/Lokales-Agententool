# opena20 Dashboard Agent - Virtual Host Configuration
# PORTIER 3.0 API Gateway

server {
    listen 80;
    server_name dashboard.portier.local localhost;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:;" always;

    # Rate Limiting
    limit_req zone=api_limit burst=20 nodelay;
    limit_conn conn_limit 20;

    # Root Location
    location / {
        proxy_pass http://opena20_backend;

        # Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffer Settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Keep-Alive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # API Endpoints with Enhanced Security
    location /api/ {
        # Additional rate limiting for API
        limit_req zone=api_limit burst=10 nodelay;

        # Bearer Token Validation (Optional)
        # auth_request /auth;

        proxy_pass http://opena20_backend;

        # API-specific headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Gateway "nginx";

        # CORS for API
        add_header Access-Control-Allow-Origin "http://localhost:3000" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://localhost:3000";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
    }

    # Server-Sent Events (SSE)
    location /sse/ {
        proxy_pass http://opena20_backend;

        # SSE-specific configuration
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Cache-Control "no-cache";
        proxy_set_header X-Accel-Buffering "no";

        # Disable buffering for real-time events
        proxy_buffering off;
        proxy_cache off;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health Check Endpoint
    location /health {
        proxy_pass http://opena20_backend;

        # Quick health checks
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        # No rate limiting for health checks
        limit_req off;
        limit_conn off;

        # Monitoring headers
        add_header X-Health-Check "nginx" always;
    }

    # Static Files (if served by NGINX)
    location /static/ {
        # Serve static files directly (if mounted)
        # alias /app/static/;

        # Or proxy to backend
        proxy_pass http://opena20_backend;

        # Caching for static files
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Authentication Endpoint (Internal)
    location = /auth {
        internal;
        proxy_pass http://opena20_backend/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# HTTPS Configuration (Optional)
server {
    listen 443 ssl http2;
    server_name dashboard.portier.local;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/portier.crt;
    ssl_certificate_key /etc/nginx/ssl/portier.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Include same configuration as HTTP
    include /etc/nginx/conf.d/opena20-common.conf;
}
