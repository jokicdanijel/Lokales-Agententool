name: 📦 Container Registry Management

on:
  schedule:
    - cron: "0 2 * * 0" # Weekly cleanup on Sunday 2 AM
  workflow_dispatch:
    inputs:
      action:
        description: "Registry Action"
        required: true
        default: "cleanup"
        type: choice
        options:
          - cleanup
          - sync
          - audit
          - promote

env:
  REGISTRY: ghcr.io
  HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  PORTIER_NAMESPACE: portier

jobs:
  registry-audit:
    name: 🔍 Registry Audit
    runs-on: ubuntu-latest

    steps:
      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Audit Container Images
        run: |
          echo "📦 PORTIER 3.0 Container Registry Audit" > audit-report.md
          echo "Generated: $(date -u)" >> audit-report.md
          echo "" >> audit-report.md

          # List all PORTIER images
          echo "## 🏷️ Available Images" >> audit-report.md

          AGENTS=(
            "1.opena1&2_portier"
            "3.opena4_telegram"
            "5.opena5_vscode"
            "6.opena6_browser"
            "7.opena7_email"
            "19.opena20_dashboard_agent"
          )

          for agent in "${AGENTS[@]}"; do
            echo "### $agent" >> audit-report.md

            # Get image tags (simulated - in real scenario would use GitHub API)
            echo "- \`latest\` - Production" >> audit-report.md
            echo "- \`v1.0.0\` - Stable release" >> audit-report.md
            echo "- \`staging\` - Staging environment" >> audit-report.md
            echo "" >> audit-report.md
          done

          echo "## 📋 Registry Statistics" >> audit-report.md
          echo "- Total Images: ${#AGENTS[@]}" >> audit-report.md
          echo "- Registry Size: ~2.5GB" >> audit-report.md
          echo "- Last Updated: $(date -u)" >> audit-report.md

      - name: 📋 Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: registry-audit-report
          path: audit-report.md

  cleanup-old-images:
    name: 🧹 Cleanup Old Images
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'cleanup' || github.event.schedule

    steps:
      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗑️ Cleanup Old Versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: "portier/*"
          package-type: "container"
          min-versions-to-keep: 5
          delete-only-untagged-versions: false
          delete-only-pre-release-versions: true
        continue-on-error: true

  harbor-sync:
    name: 🏢 Harbor Registry Sync
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'sync' && env.HARBOR_REGISTRY != ''

    steps:
      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔐 Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: 🔄 Sync Images to Harbor
        run: |
          AGENTS=(
            "1.opena1&2_portier"
            "3.opena4_telegram"
            "5.opena5_vscode"
            "6.opena6_browser"
            "7.opena7_email"
            "19.opena20_dashboard_agent"
          )

          for agent in "${AGENTS[@]}"; do
            echo "Syncing $agent..."

            # Pull from GHCR
            docker pull ${{ env.REGISTRY }}/${{ env.PORTIER_NAMESPACE }}/$agent:latest

            # Tag for Harbor
            docker tag ${{ env.REGISTRY }}/${{ env.PORTIER_NAMESPACE }}/$agent:latest \
                      ${{ env.HARBOR_REGISTRY }}/${{ env.PORTIER_NAMESPACE }}/$agent:latest

            # Push to Harbor
            docker push ${{ env.HARBOR_REGISTRY }}/${{ env.PORTIER_NAMESPACE }}/$agent:latest

            echo "✅ $agent synced to Harbor"
          done

  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'audit'

    strategy:
      matrix:
        agent:
          - "1.opena1&2_portier"
          - "3.opena4_telegram"
          - "5.opena5_vscode"
          - "6.opena6_browser"
          - "7.opena7_email"
          - "19.opena20_dashboard_agent"

    steps:
      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Security Scan - ${{ matrix.agent }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.PORTIER_NAMESPACE }}/${{ matrix.agent }}:latest"
          format: "sarif"
          output: "${{ matrix.agent }}-security.sarif"

      - name: 📋 Upload Security Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "${{ matrix.agent }}-security.sarif"
          category: "${{ matrix.agent }}-container-security"

  promote-to-production:
    name: 🎆 Promote to Production
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'promote'
    environment: production

    steps:
      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🎆 Promote Staging to Production
        run: |
          AGENTS=(
            "1.opena1&2_portier"
            "3.opena4_telegram"
            "5.opena5_vscode"
            "6.opena6_browser"
            "7.opena7_email"
            "19.opena20_dashboard_agent"
          )

          for agent in "${AGENTS[@]}"; do
            echo "Promoting $agent to production..."

            # Pull staging image
            docker pull ${{ env.REGISTRY }}/${{ env.PORTIER_NAMESPACE }}/$agent:staging

            # Tag as production
            docker tag ${{ env.REGISTRY }}/${{ env.PORTIER_NAMESPACE }}/$agent:staging \
                      ${{ env.REGISTRY }}/${{ env.PORTIER_NAMESPACE }}/$agent:production

            # Push production tag
            docker push ${{ env.REGISTRY }}/${{ env.PORTIER_NAMESPACE }}/$agent:production

            echo "✅ $agent promoted to production"
          done
