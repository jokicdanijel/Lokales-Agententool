name: Production Hardening

on:
  push:
    branches: [main, ci/**, feat/**]
  pull_request:
    branches: [main]

jobs:
  preflight-gate:
    name: Preflight Gate Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Make scripts executable
        run: |
          chmod +x scripts/preflight.sh
          chmod +x scripts/*_scanner.py

      - name: Run Preflight Gate
        id: preflight
        run: |
          cd 19.opena20_dashboard_agent
          ./scripts/preflight.sh
        continue-on-error: true

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-scan-reports
          path: |
            19.opena20_dashboard_agent/artifacts/scans/*.json
            19.opena20_dashboard_agent/artifacts/scans/*.md
          retention-days: 30

      - name: Check preflight result
        if: steps.preflight.outcome == 'failure'
        run: |
          echo "❌ Preflight Gate FAILED - Production Hardening violations detected"
          echo ""
          echo "📊 Review scan reports in artifacts:"
          ls -lh 19.opena20_dashboard_agent/artifacts/scans/
          echo ""
          exit 1

      - name: Success summary
        if: steps.preflight.outcome == 'success'
        run: |
          echo "✅ Preflight Gate PASSED"
          echo "✅ All production hardening checks validated"
          echo "🚀 Ready for deployment"

  baseline-validation:
    name: System Baseline Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Validate baseline
        run: |
          cd 19.opena20_dashboard_agent
          python3 scripts/validate_baseline.py

      - name: Upload baseline validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-validation
          path: |
            19.opena20_dashboard_agent/artifacts/baseline_validation.json
          retention-days: 30

  entitlements-validation:
    name: Entitlements System Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Build entitlements
        run: |
          cd 19.opena20_dashboard_agent
          python3 scripts/build_entitlements.py

      - name: Validate entitlements
        run: |
          cd 19.opena20_dashboard_agent
          python3 scripts/validate_entitlements.py

      - name: Upload entitlements artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entitlements-validation
          path: |
            19.opena20_dashboard_agent/build/entitlements.json
            19.opena20_dashboard_agent/artifacts/entitlements_validation.json
          retention-days: 30

  summary:
    name: Production Hardening Summary
    runs-on: ubuntu-latest
    needs: [preflight-gate, baseline-validation, entitlements-validation]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          echo "Production Hardening Results:"
          echo "─────────────────────────────────────────"
          echo "Preflight Gate:         ${{ needs.preflight-gate.result }}"
          echo "Baseline Validation:    ${{ needs.baseline-validation.result }}"
          echo "Entitlements:           ${{ needs.entitlements-validation.result }}"
          echo "─────────────────────────────────────────"

          if [[ "${{ needs.preflight-gate.result }}" != "success" ]] || \
             [[ "${{ needs.baseline-validation.result }}" != "success" ]] || \
             [[ "${{ needs.entitlements-validation.result }}" != "success" ]]; then
            echo ""
            echo "❌ PRODUCTION HARDENING FAILED"
            echo "⚠️  Deployment blocked - fix violations before merge"
            exit 1
          fi

          echo ""
          echo "✅ ALL PRODUCTION HARDENING CHECKS PASSED"
          echo "🚀 Code is production-ready"
