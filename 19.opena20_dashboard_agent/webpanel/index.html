<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenWebUI Agent V2 – Control Panel</title>
<link rel="stylesheet" href="style.css">
<script defer src="config.js"></script>
<script defer src="app.js"></script>
</head>

<body>

<header>
    <img src="assets/logo.svg" class="logo">
    <h1>OpenWebUI Agent V2 – PORTIER 3.0 Panel</h1>
</header>

<main class="container">

    <section class="card">
        <h2>🔐 Authentication</h2>
        <input id="token" placeholder="Bearer Token eingeben …">
    </section>

    <section class="card">
        <h2>🩺 Health Check</h2>
        <button onclick="checkHealth()">Ausführen</button>
        <pre id="health_output" class="log"></pre>
    </section>

    <section class="card">
        <h2>💬 Native Chat</h2>
        <textarea id="chat_prompt" placeholder="Nachricht eingeben …"></textarea>
        <button onclick="sendChat()">Senden</button>
        <pre id="chat_output" class="log"></pre>
    </section>

    <section class="card">
        <h2>🛠️ CMD Dispatch</h2>
        <textarea id="cmd_json">{ 
    "request_id": "html-ui-1",
    "timestamp": "2025-11-29T12:00:00Z",
    "source": "webui",
    "command": "chat",
    "payload": { "prompt": "Ping" }
}</textarea>
        <button onclick="sendCMD()">Senden</button>
        <pre id="cmd_output" class="log"></pre>
    </section>

    <section class="card">
        <h2>🚦 Dispatch Ready</h2>
        <button onclick="dispatchReady()">Status</button>
        <pre id="dispatch_output" class="log"></pre>
    </section>

    <section class="card">
        <h2>🧪 Self-Test</h2>
        <button onclick="runSelftest()">Start</button>
        <pre id="selftest_output" class="log"></pre>
    </section>

</main>
</body>
</html>
