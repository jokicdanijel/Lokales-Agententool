version: "3.8"

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "${HOST_PORT:-3000}:8080"
    environment:
      - ENABLE_SIGNUP=True
      # Setzt der Agent gleich sinnvoll; sicherer Default:
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      # Achtung: Nur im vertrauenswürdigen LAN deaktivieren! Für Internetzugriff AUF JEDEN FALL aktivieren.
      WEBUI_AUTH: "${WEBUI_AUTH:-False}"
    volumes:
      # Named Volume für DB/Vektoren (persistente WebUI-Daten)
      - openwebui_data:/app/backend/data
      # Optionaler Bind-Mount für deine eigenen Dateien (bitte Pfad anpassen/setzen)
      - ${HOST_DATA_DIR:-/dev/null}:/workspace/hostdata:rw
    restart: unless-stopped

volumes:
  openwebui_data:

