name: 2openwebui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - TZ=Europe/Vienna
      # Auth ist aktiviert (kein WEBUI_AUTH=False)
      # Optional: Falls du Ollama lokal nutzt, aktiviere:
      # - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openwebui_data:/app/backend/data
    restart: unless-stopped

volumes:
  openwebui_data:
    external: true
    name: 2openwebui_openwebui_data
