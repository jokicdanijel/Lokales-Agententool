# Agent Registry – Zentralisierte Konfiguration für alle 20 Agenten
# Dieses File wird von tool_registry.py, tool_dispatcher.py und dedupe_engine.py gelesen

version: "1.0"
created: "2025-11-10"
scope: "ELION Gesamtprojekt – Hyper-Dashboard"

# ============================================================================
# INFRASTRUKTUR-AGENTEN (Basis)
# ============================================================================
infrastructure:
  kordinator:
    agent_id: "opena1"
    name: "Portier Koordinator"
    port: 12344
    archive_key: "kordp"
    description: "Central routing, validation, safepoint lifecycle"
    api_base: "http://127.0.0.1:12344"
    endpoints:
      - path: "/health"
        method: "GET"
        purpose: "Health check"
      - path: "/api/dispatch"
        method: "POST"
        purpose: "Route tool request to agent"
      - path: "/api/status"
        method: "GET"
        purpose: "System status"
    type: "infrastructure"
    enabled: true

  archivator:
    agent_id: "opena2"
    name: "Archivator (Append-Only Storage)"
    port: 12345
    archive_key: "archivp"
    description: "Persistent storage, safepoint deduplication, integrity checks"
    api_base: "http://127.0.0.1:12345"
    endpoints:
      - path: "/health"
        method: "GET"
        purpose: "Health check"
      - path: "/store/archivp"
        method: "POST"
        purpose: "Write safepoint"
      - path: "/archiv/last"
        method: "GET"
        purpose: "Query last N safepoints"
      - path: "/integrity/verify"
        method: "POST"
        purpose: "Verify integrity chain"
    type: "infrastructure"
    enabled: true
    storage:
      path: "archivp"
      format: "jsonl"
      append_only: true
      dedup_via_hash: "sha256"

