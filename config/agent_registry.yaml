# ============================================================================
# ROUTING-POLICIES
# ============================================================================
routing_policies:
  default_timeout_seconds: 30
  retry_attempts: 3
  retry_backoff_ms: 500
  health_check_interval_seconds: 60
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout_seconds: 60

# ============================================================================
# SAFEPOINT-POLICIES (Schritt 3 Integration)
# ============================================================================
safepoint_policies:
  append_only: true
  dedup_via_hash: "sha256"
  hash_algorithm: "sha256"
  archive_retention_days: 365
  integrity_check_interval_hours: 24
  chain_verification:
    enabled: true
    checkpoint_frequency: 100

# ============================================================================
# PORT-POLICY ENFORCEMENT
# ============================================================================
port_policy:
  allowed_range:
    min: 12344
    max: 12369
  forbidden_ports:
    - 8080
  binding:
    - "127.0.0.1"  # loopback only
  total_agents: 20
  infrastructure_agents: 2
  communication_agents: 4
  chatbot_agents: 4
  functional_agents: 4
  content_creator_agents: 3
  data_management_agents: 3

# ============================================================================
# SCHRITT-INTEGRATION
# ============================================================================
steps:
