# ────────────────────────────────────────────────────────────────────
# Coordinator Configuration
# ────────────────────────────────────────────────────────────────────

coordinator:
  host: 127.0.0.1
  port: 12344
  program_target: kordp
  registry_strategy: in_memory # TODO: Upgrade to Redis for persistence
  route_ttl_seconds: 300
  max_routes: 100
  dispatch_timeout_seconds: 30
  health_check_interval_seconds: 5

# ────────────────────────────────────────────────────────────────────
# Archivator Configuration
# ────────────────────────────────────────────────────────────────────

archivator:
  host: 127.0.0.1
  port: 12345
  program_target: archivp
  storage_type: file_jsonl
  storage_path: 1.opena1&2_portier/archivp_store
  index_file: index.jsonl
  partition_strategy: daily # YYYY/MM/DD structure
  rotation_days: 30

# ────────────────────────────────────────────────────────────────────
# Load Balancing Policy
# ────────────────────────────────────────────────────────────────────

load_balancing:
  strategy: round_robin
  health_check_enabled: true
  circuit_breaker_threshold: 5 # Fail after 5 consecutive errors
  circuit_breaker_timeout_seconds: 30
  fallback_strategy: next_available

# ────────────────────────────────────────────────────────────────────
# Monitoring & Metrics
# ────────────────────────────────────────────────────────────────────

monitoring:
  safepoint_logging_enabled: true
  metrics_collection_enabled: true
  archive_safepoint_kinds:
    - INIT
    - ROUTE
    - DISPATCH
    - HEALTH
    - COMPLETION
    - MESSAGE_IN
    - MESSAGE_OUT
    - ECHO

