<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenA2 Archivator - ELION Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h1 {
            color: #10b981;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .info-card h3 {
            color: #10b981;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: bold;
            color: #666;
        }

        .info-value {
            color: #333;
            font-family: 'Courier New', monospace;
        }

        .status-ok {
            color: #10b981;
            font-weight: bold;
        }

        .status-error {
            color: #ef4444;
            font-weight: bold;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        button {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            margin: 0 10px;
            transition: background 0.3s;
        }

        button:hover {
            background: #059669;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .stats-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .stats-section h3 {
            color: #10b981;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        .stat-number {
            font-size: 3em;
            font-weight: bold;
            color: #065f46;
        }

        .stat-label {
            color: #666;
            font-size: 1.1em;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        pre {
            background: #f9fafb;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 0.9em;
        }

        .archive-path {
            background: #f9fafb;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/ui_index.html" class="back-link">← Zurück zum Dashboard</a>

        <header>
            <h1>💾 OpenA2 - Archivator</h1>
            <p class="subtitle">Zentrale Archivierung & Safepoint-Management</p>
        </header>

        <div class="controls">
            <button onclick="refreshData()" id="refreshBtn">🔄 Aktualisieren</button>
            <button onclick="testStore()" id="storeBtn">💾 Test Store</button>
            <button onclick="viewArchive()" id="archiveBtn">📂 Archiv öffnen</button>
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="stats-section">
            <h3>📊 Archive Statistics</h3>
            <div class="stat-box">
                <div class="stat-number" id="entryCount">-</div>
                <div class="stat-label">Gespeicherte Einträge</div>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-card">
                <h3>📊 Service Status</h3>
                <div id="statusInfo">
                    <div class="loading">Lade Daten...</div>
                </div>
            </div>

            <div class="info-card">
                <h3>⚙️ Konfiguration</h3>
                <div id="configInfo">
                    <div class="loading">Lade Daten...</div>
                </div>
            </div>

            <div class="info-card">
                <h3>🔑 OpenAI Integration</h3>
                <div id="openaiInfo">
                    <div class="loading">Lade Daten...</div>
                </div>
            </div>
        </div>

        <div class="info-card">
            <h3>📂 Archiv-Pfad</h3>
            <div class="archive-path" id="archivePath">
                Lade Pfad...
            </div>
        </div>
    </div>

    <script>
        const PORT = 12345;
        const API_BASE = `http://127.0.0.1:${PORT}`;

        async function refreshData() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Lädt...';

            try {
                const response = await fetch(`${API_BASE}/health`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                updateUI(data);

                document.getElementById('error').style.display = 'none';
            } catch (error) {
                showError(`Fehler beim Laden: ${error.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 Aktualisieren';
            }
        }

        async function testStore() {
            const btn = document.getElementById('storeBtn');
            btn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/store/archivp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        src: 'dashboard',
                        dst: 'archivp',
                        kind: 'CMD',
                        body: {
                            action: 'test_store',
                            timestamp: new Date().toISOString(),
                            message: 'Test from OpenA2 Dashboard'
                        },
                        strict: true
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                alert('✅ Safepoint erfolgreich gespeichert!\n\nPfad: ' + data.path);
                refreshData();
            } catch (error) {
                alert('❌ Store fehlgeschlagen: ' + error.message);
            } finally {
                btn.disabled = false;
            }
        }

        function viewArchive() {
            const basePath = document.getElementById('archivePath').textContent;
            if (basePath && basePath !== 'Lade Pfad...') {
                alert('📂 Archiv-Pfad:\n\n' + basePath + '\n\nÖffne diesen Pfad im Dateimanager.');
            }
        }

        function updateUI(data) {
            // Entry Count
            document.getElementById('entryCount').textContent = data.entries || 0;

            // Status Info
            const statusHTML = `
                <div class="info-row">
                    <span class="info-label">Status:</span>
                    <span class="info-value status-ok">${data.status}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Service:</span>
                    <span class="info-value">${data.service}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Rolle:</span>
                    <span class="info-value">${data.role}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Host:</span>
                    <span class="info-value">${data.host}</span>
                </div>
            `;
            document.getElementById('statusInfo').innerHTML = statusHTML;

            // Config Info
            const configHTML = `
                <div class="info-row">
                    <span class="info-label">Port:</span>
                    <span class="info-value">${data.port}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Einträge:</span>
                    <span class="info-value">${data.entries}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Strict Mode:</span>
                    <span class="info-value">${data.strict ? '✓ Aktiv' : '✗ Inaktiv'}</span>
                </div>
            `;
            document.getElementById('configInfo').innerHTML = configHTML;

            // OpenAI Info
            const openaiHTML = `
                <div class="info-row">
                    <span class="info-label">API Key:</span>
                    <span class="info-value ${data.openai_key_present ? 'status-ok' : 'status-error'}">
                        ${data.openai_key_present ? '✓ Vorhanden' : '✗ Fehlt'}
                    </span>
                </div>
                <div class="info-row">
                    <span class="info-label">Fingerprint:</span>
                    <span class="info-value">${data.openai_fp || 'N/A'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Base URL:</span>
                    <span class="info-value">${data.openai_base_url}</span>
                </div>
            `;
            document.getElementById('openaiInfo').innerHTML = openaiHTML;

            // Archive Path
            document.getElementById('archivePath').textContent =
                data.base_root + '/1.opena1&2_portier/archivp_store/';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Initialize
        window.addEventListener('load', () => {
            refreshData();
        });
    </script>
</body>
</html>
