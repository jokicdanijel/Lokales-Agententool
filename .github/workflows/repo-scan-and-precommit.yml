name: Repo Scan & Pre-commit

on:
  pull_request:
    paths:
      - '**'

jobs:
  precommit-and-scan:
    name: Pre-commit + Repo Policy Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit (all files)
        run: |
          pre-commit run --all-files

      - name: Run repo scanner (policy-relevant paths)
        run: |
          python3.12 scripts/repo_scan.py --paths .github docker-compose.yml infrastructure/nginx apps pyproject.toml --out-dir build || true

      - name: Fail if policy hits detected
        run: |
          python3 - <<'PY'
import json,sys
try:
  j=json.load(open('build/repo_scan_report.json'))
except Exception as e:
  print('No report found or error:', e)
  sys.exit(1)
hits=[f for f in j.get('files',[]) if f.get('policy_hits')]
if hits:
  print('POLICY-HITS FOUND:')
  for f in hits:
    print(f" - {f['path']}: {f['policy_hits']}")
  sys.exit(1)
print('No policy hits')
PY

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-scan-report
          path: build/repo_scan_report.*
