name: ELION Preflight Check

on:
  push:
    branches: [ main, develop, ci/* ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly build at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  preflight:
    name: Preflight Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

          # Install project dependencies if requirements.txt exists
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: 🔍 Run Preflight Check
        id: preflight
        run: |
          echo "::group::Preflight Validation"
          python scripts/preflight_check.py
          echo "::endgroup::"
        continue-on-error: false

      - name: 📊 Upload Preflight Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-results
          path: |
            artifacts/preflight_result.json
            artifacts/agent_capabilities.json
          retention-days: 30

      - name: 📝 Generate Summary
        if: always()
        run: |
          echo "## 🚀 Preflight Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f artifacts/preflight_result.json ]; then
            python -c "
import json
with open('artifacts/preflight_result.json', 'r') as f:
    result = json.load(f)

with open('$GITHUB_STEP_SUMMARY', 'a') as summary:
    summary.write(f'### 📊 Statistics\n\n')
    summary.write(f'- **Agents Checked:** {result[\"agents_checked\"]}\n')
    summary.write(f'- **Agents Passed:** {result[\"agents_passed\"]}\n')
    summary.write(f'- **Agents Failed:** {result[\"agents_failed\"]}\n')
    summary.write(f'- **Violations:** {len(result[\"violations\"])}\n')
    summary.write(f'- **Warnings:** {len(result[\"warnings\"])}\n\n')

    if result['violations']:
        summary.write(f'### ❌ Violations\n\n')
        for v in result['violations'][:10]:
            summary.write(f'- {v}\n')
            "
          else
            echo "❌ Preflight result file not found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: ✅ Preflight Passed
        if: success()
        run: |
          echo "::notice::✅ All preflight checks passed - System ready for deployment"

      - name: ❌ Preflight Failed
        if: failure()
        run: |
          echo "::error::❌ Preflight checks failed - Review violations before proceeding"
          exit 1

  validate-baseline:
    name: Validate System Baseline
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install PyYAML
        run: pip install pyyaml

      - name: ✅ Validate Baseline
        run: |
          if [ -f scripts/validate_baseline.py ]; then
            python scripts/validate_baseline.py
          else
            echo "⚠️ validate_baseline.py not found, skipping"
          fi

      - name: 📊 Check Agent Count
        run: |
          if [ -f system_baseline.yaml ]; then
            python -c "
import yaml
with open('system_baseline.yaml', 'r') as f:
    baseline = yaml.safe_load(f)
    agent_count = len(baseline.get('agents', []))
    print(f'✅ Baseline contains {agent_count} agents')
    if agent_count != 21:
        print(f'⚠️ Expected 21 agents, found {agent_count}')
            "
          else
            echo "⚠️ system_baseline.yaml not found"
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔒 Run Bandit Security Scan
        run: |
          pip install bandit
          bandit -r . -ll -i -x ./tests,./venv,./.venv || true
        continue-on-error: true

      - name: 🔍 Check for Secrets
        run: |
          echo "Checking for potential hardcoded secrets..."

          ! grep -rn --include="*.py" 'password\s*=\s*['\''"][^'\''"]\{10,\}['\''"]' . || {
            echo "⚠️ Potential hardcoded password found"
            exit 0
          }

          ! grep -rn --include="*.py" 'api_key\s*=\s*['\''"][^'\''"]\{20,\}['\''"]' . || {
            echo "⚠️ Potential hardcoded API key found"
            exit 0
          }

  deploy-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [preflight, validate-baseline]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ✅ Deployment Ready
        run: |
          echo "::notice::✅ System passed all checks - Ready for deployment"
          echo "## 🚀 Deployment Ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All validation checks passed. System is ready for deployment." >> $GITHUB_STEP_SUMMARY
