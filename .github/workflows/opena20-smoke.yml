name: opena20 smoke tests

on:
  push:
    branches: [ "main", "feat/opena20-ci-smoke" ]
  pull_request:
    branches: [ "main" ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run docker-compose
        run: |
          docker-compose up -d --build

      - name: Wait for /health
        run: |
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:12349/health >/dev/null; then
              echo "opena20 /health ready" && break
            fi
            echo "waiting..."; sleep 2
          done

      - name: Run smoke tests
        run: |
          chmod +x ./tests/smoke_opena20.sh
          ./tests/smoke_opena20.sh

      - name: Tear down
        if: always()
        run: docker-compose down --volumes --remove-orphans
