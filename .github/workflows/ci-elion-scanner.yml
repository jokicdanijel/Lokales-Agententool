name: CI — ELION scanner & policy

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'scripts/tests/**'
      - 'docs/**'
      - '.github/workflows/**'

jobs:
  scanner-check:
    runs-on: ubuntu-latest
    name: Run ELION scanner tests & policy scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run policy doc scan
        run: |
          python scripts/policy_doc_scan.py --root . --strict-url-ports --check-html-contract || (cat artifacts/policy_doc_scan_report.json && exit 1)

      - name: Run scanner tests
        run: |
          pytest -q scripts/tests/test_elion_service_scanner.py -q

      - name: Save scan artifacts
        if: always()
        run: |
          mkdir -p artifacts/ci
          cp -v artifacts/policy_doc_scan_report.json artifacts/ci/ || true

  merge-preview:
    runs-on: ubuntu-latest
    needs: scanner-check
    name: Merge preview (compose build)
    if: github.event_name == 'pull_request' && always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gather scan outputs
        run: |
          mkdir -p artifacts/scans || true
          # run scanner for all services under services/ and infrastructure/ if present
          for d in services/* infrastructure/* monitoring/* 2>/dev/null || true; do
            if [ -d "$d" ]; then
              name=$(basename "$d")
              python scripts/elion_service_scanner.py --service-dir "$d" --plan basic > artifacts/scans/${name}.scan.txt || true
            fi
          done

      - name: Merge scan outputs
        run: |
          python scripts/elion_compose_merger.py --input-dir artifacts/scans --out-dir artifacts/merged || true

      - name: Upload merged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merged-compose
          path: artifacts/merged
