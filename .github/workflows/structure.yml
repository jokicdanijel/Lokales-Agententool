name: structure

on:
  push:
    paths:
      - 'src/**'
      - 'configs/**'
      - 'assets/**'
      - 'scripts/**'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
    inputs:
      apply_structure:
        description: 'Apply structure changes (maintainer-only)'
        required: false
        default: 'false'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pylint

      - name: Lint (ruff)
        run: ruff check scripts/ || true

      - name: Format check (black)
        run: black --check scripts/ || true

  dry-run-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run dry-run validation
        run: |
          python scripts/structure_manager.py
        shell: bash

      - name: Upload structure reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structure-reports
          path: |
            rename_map.csv
            path_index.json
            violations_report.md
            structure_checkpoint.json
          retention-days: 30

      - name: Check violations
        run: |
          if grep -q "Violations" violations_report.md; then
            echo "⚠ Structure violations detected - review before merge"
            cat violations_report.md
          else
            echo "✅ No violations found"
          fi
        shell: bash

  apply-structure:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply_structure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: dry-run-structure

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply structure changes
        run: |
          python scripts/structure_manager.py --apply --symlinks
        shell: bash

      - name: Commit structure changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "chore(structure): apply folder normalization [$(date +%Y%m%d-%H%M%S)]" || echo "No changes to commit"
          git push
        shell: bash

      - name: Create release
        if: success()
        run: |
          bash scripts/make_release.sh $(date +%Y%m%d-%H%M%S)
        shell: bash

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-artifacts
          path: backups/
          retention-days: 90
