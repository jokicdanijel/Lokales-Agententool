name: Evaluation Runner

on:
    push:
        branches: [main]
    pull_request:
        paths: ["evaluation/**", "requirements-eval.txt", "docs/EVALUATION.md"]
    schedule:
        - cron: "0 2 * * *" # daily at 02:00 UTC

jobs:
    run-evaluation:
        runs-on: ubuntu-latest
        env:
            PYTHON_VERSION: "3.12"
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install eval requirements
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements-eval.txt

            - name: Run evaluation
              run: |
                  mkdir -p evaluation/results
                  python -m evaluation.runner evaluation/datasets/sample.jsonl --out evaluation/results/report.json

            - name: Upload report
              uses: actions/upload-artifact@v3
              with:
                  name: evaluation-report
                  path: evaluation/results/report.json

            - name: Upload results directory
              uses: actions/upload-artifact@v3
              with:
                  name: evaluation-results
                  path: evaluation/results
