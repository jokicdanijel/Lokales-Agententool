name: CI - Structure Validation & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # GATE 1: Structure Drift Detection (HARD STOP on mismatch)
  # ═══════════════════════════════════════════════════════════════════════
  no-drift-structure:
    name: "🛡️ Structure Validation (no drift allowed)"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Validate service folder structure
        run: pytest -v tests/test_service_folders.py::test_services_folder_structure
        
      - name: Validate README files exist
        run: pytest -v tests/test_service_folders.py::test_readme_exists_for_all_services

      - name: Validate program targets mapping
        run: pytest -v tests/test_service_folders.py::test_program_targets_mapping

      - name: Validate README contains program targets
        run: pytest -v tests/test_service_folders.py::test_readme_contains_program_target

  # ═══════════════════════════════════════════════════════════════════════
  # GATE 2: Config Validation
  # ═══════════════════════════════════════════════════════════════════════
  config-validation:
    name: "⚙️ Config & YAML Validation"
    runs-on: ubuntu-latest
    needs: [no-drift-structure]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate YAML syntax
        run: |
          python -m pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('configs/routing_matrix.yaml'))"
          echo "✅ routing_matrix.yaml valid"

  # ═══════════════════════════════════════════════════════════════════════
  # GATE 3: Python Linting (optional, non-blocking for now)
  # ═══════════════════════════════════════════════════════════════════════
  lint:
    name: "🔍 Python Linting (optional)"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          pip install flake8

      - name: Lint test files
        run: flake8 tests/ --max-line-length=120 --extend-ignore=E203
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════
  # SUMMARY
  # ═══════════════════════════════════════════════════════════════════════
  ci-summary:
    name: "📊 CI Summary"
    runs-on: ubuntu-latest
    needs: [no-drift-structure, config-validation]
    
    steps:
      - name: Report success
        run: |
          echo "✅ All CI gates passed"
          echo "  - Service folder structure: OK"
          echo "  - Program targets mapping: OK"
          echo "  - Config validation: OK"
