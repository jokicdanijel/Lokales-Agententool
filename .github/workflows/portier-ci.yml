name: portier-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.8 black==24.8.0 mypy==1.11.2 pytest==8.3.3 \
                      fastapi==0.115.0 uvicorn==0.30.6 requests==2.32.3 pydantic==2.9.2

      - name: Static analysis (Ruff)
        run: ruff check .

      - name: Code style (Black)
        run: black --check .

      - name: Type check (mypy) – tolerant
        run: |
          mypy --python-version 3.13 --install-types --non-interactive || true

      - name: Project policy checks
        run: |
          bash 1.portier_openai/skripte/validate_portier.sh

      - name: Unit tests (if any)
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "no tests/ directory – skipping"
          fi

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            1.portier_openai/venv313
          key: venv-${{ runner.os }}-${{ hashFiles('1.portier_openai/requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic requests aiohttp

      - name: Verify project structure
        run: |
          echo "Checking critical files..."
          test -f .github/workflows/portier-ci.yml && echo "✅ CI Workflow"
          test -f 1.portier_openai/skripte/validate_portier.sh && echo "✅ Policy Validator"
          test -f 1.portier_openai/config/tools_registry.json && echo "✅ Tools Registry"
          for agent in 4.telegram_agent 5.vscode_agent 6.mail_agent 7.whatsapp_agent; do
            test -f "$agent/main_agent.py" && echo "✅ $agent"
          done
          test -f bin/ops.sh && echo "✅ CLI Dispatcher"

      - name: Verify port assignments
        run: |
          echo "Checking port allocations..."
          grep -q "12347" 4.telegram_agent/main_agent.py || { echo "❌ Port 12347 missing"; exit 1; }
          echo "✅ opena4: 12347"
          grep -q "12348" 5.vscode_agent/main_agent.py || { echo "❌ Port 12348 missing"; exit 1; }
          echo "✅ opena5: 12348"
          grep -q "12349" 6.mail_agent/main_agent.py || { echo "❌ Port 12349 missing"; exit 1; }
          echo "✅ opena6: 12349"
          grep -q "12350" 7.whatsapp_agent/main_agent.py || { echo "❌ Port 12350 missing"; exit 1; }
          echo "✅ opena7: 12350"

      - name: Run policy validator
        run: |
          bash 1.portier_openai/skripte/validate_portier.sh

      - name: Generate deployment summary
        run: |
          echo "## 🚀 Deployment Summary" > /tmp/deploy_summary.md
          echo "" >> /tmp/deploy_summary.md
          echo "**Commit**: $(git rev-parse --short HEAD)" >> /tmp/deploy_summary.md
          echo "**Branch**: $(git rev-parse --abbrev-ref HEAD)" >> /tmp/deploy_summary.md
          echo "**Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> /tmp/deploy_summary.md
          echo "" >> /tmp/deploy_summary.md
          echo "### Agents Deployed" >> /tmp/deploy_summary.md
          for port in 12347 12348 12349 12350; do
            echo "- Port $port: ✅ Ready" >> /tmp/deploy_summary.md
          done
          echo "" >> /tmp/deploy_summary.md
          echo "### Services Online" >> /tmp/deploy_summary.md
          echo "- Dashboard: :12349" >> /tmp/deploy_summary.md
          echo "- Archivator: :12345" >> /tmp/deploy_summary.md
          echo "- Coordinator: :12344" >> /tmp/deploy_summary.md
          cat /tmp/deploy_summary.md
