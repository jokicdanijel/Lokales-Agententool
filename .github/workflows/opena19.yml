name: opena19 CI/CD Pipeline (Robust)

on:
  push:
    branches: [ main, develop ]
    paths:
      - '7.opena19_whatsapp/**'
      - 'dist/opena19/**'
      - '.github/workflows/opena19.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '7.opena19_whatsapp/**'
      - '.github/workflows/opena19.yml'

concurrency:
  group: opena19-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: 7.opena19_whatsapp
  DIST_DIR: dist/opena19
  PORT: "12364"
  SERVICE_NAME: opena19
  REGISTRY: docker.io
  IMAGE_NAME: opena19
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  # ========================================
  # LINT & CODE QUALITY
  # ========================================
  lint:
    name: Code Quality (Pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pre-commit
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit hooks
        run: |
          set -euo pipefail
          pre-commit run --all-files

  # ========================================
  # PYTHON SYNTAX & IMPORT CHECKS
  # ========================================
  python-check:
    name: Python Syntax & Imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ${{ env.APP_DIR }}

      - name: Check Python syntax
        run: |
          set -euo pipefail
          python -m py_compile app/main.py
        working-directory: ${{ env.APP_DIR }}

      - name: Check imports
        run: |
          set -euo pipefail
          python -c "from app.main import app; print('✅ Imports OK')"
        working-directory: ${{ env.APP_DIR }}

  # ========================================
  # DOCKER BUILD & TEST
  # ========================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ lint, python-check ]
    env:
      COMPOSE_PROJECT_NAME: opena19_ci
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compose config validation
        run: |
          set -euo pipefail
          cd "${DIST_DIR}"
          docker compose config >/dev/null

      - name: Build Docker image (test)
        run: |
          set -euo pipefail
          cd "${DIST_DIR}"
          docker compose build --no-cache "${SERVICE_NAME}"

      - name: Verify container imports (no brittle container name)
        run: |
          set -euo pipefail
          cd "${DIST_DIR}"
          IMAGE_ID="$(docker compose images -q "${SERVICE_NAME}" | head -1)"
          echo "Built image id: ${IMAGE_ID}"
          test -n "${IMAGE_ID}"
          docker run --rm "${IMAGE_ID}" python -c "from app.main import app; print('✅ App imports OK in container')"

  # ========================================
  # API ENDPOINT TESTS
  # ========================================
  api-test:
    name: API Endpoint Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build
    env:
      COMPOSE_PROJECT_NAME: opena19_ci
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Start opena19 container
        run: |
          set -euo pipefail
          cd "${DIST_DIR}"
          docker compose up -d --build "${SERVICE_NAME}"

      - name: Wait for health (no sleep-race)
        run: |
          set -euo pipefail
          for i in {1..40}; do
            if curl -fsS "http://localhost:${PORT}/health" >/tmp/health.json; then
              cat /tmp/health.json
              echo "✅ Service is up"
              exit 0
            fi
            echo "Waiting... (${i}/40)"
            sleep 2
          done
          echo "❌ Service did not become healthy in time"
          cd "${DIST_DIR}"
          docker compose logs --no-color "${SERVICE_NAME}" | tail -200
          exit 1

      - name: Test health endpoint
        run: |
          set -euo pipefail
          HEALTH="$(curl -fsS "http://localhost:${PORT}/health")"
          echo "Health: $HEALTH"
          echo "$HEALTH" | grep -q "\"service\":\"${SERVICE_NAME}\"" && echo "✅ Health OK"

      - name: Test api/status
        run: |
          set -euo pipefail
          STATUS="$(curl -fsS "http://localhost:${PORT}/api/status")"
          echo "Status: $STATUS"
          echo "$STATUS" | grep -q '"version":"' && echo "✅ Status OK"

      - name: Test api/info (dashboard integration)
        run: |
          set -euo pipefail
          INFO="$(curl -fsS "http://localhost:${PORT}/api/info")"
          echo "Info: $INFO"
          echo "$INFO" | grep -q '"display_name"' && echo "✅ Info OK"

      - name: Test root endpoint (HTML UI)
        run: |
          set -euo pipefail
          HTML="$(curl -fsS "http://localhost:${PORT}/")"
          echo "$HTML" | grep -qi '<title>.*opena19' && echo "✅ HTML UI loaded"
          echo "$HTML" | grep -q '<button' && echo "✅ Buttons present"

      - name: Test workflows endpoint
        run: |
          set -euo pipefail
          WF="$(curl -fsS "http://localhost:${PORT}/workflows")"
          echo "Workflows: $WF"
          echo "$WF" | grep -q '"workflows"' && echo "✅ Workflows endpoint OK"

      - name: Dump logs on failure
        if: failure()
        run: |
          set -euo pipefail
          cd "${DIST_DIR}"
          docker compose logs --no-color "${SERVICE_NAME}" | tail -300

      - name: Cleanup containers
        if: always()
        run: |
          set -euo pipefail
          cd "${DIST_DIR}"
          docker compose down -v

  # ========================================
  # SECURITY SCAN (Soft-fail)
  # ========================================
  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.APP_DIR }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ========================================
  # COVERAGE & METRICS
  # ========================================
  metrics:
    name: Code Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Count lines of code
        run: |
          set -euo pipefail
          echo "=== opena19 Code Metrics ==="
          echo "Main app:"
          wc -l "${APP_DIR}/app/main.py"
          echo ""
          echo "HTML UI:"
          wc -l "${APP_DIR}/app/html/index.html" 2>/dev/null || echo "  (not found)"
          echo ""
          echo "JavaScript:"
          wc -l "${APP_DIR}/app/static/app.js" 2>/dev/null || echo "  (not found)"
          echo ""
          echo "CSS:"
          wc -l "${APP_DIR}/app/static/app.css" 2>/dev/null || echo "  (not found)"

  # ========================================
  # PUBLISH (main only)
  # ========================================
  publish:
    name: Build Docker Image (main only)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ lint, python-check, docker-build, api-test ]
    steps:
      - uses: actions/checkout@v4

      - name: Detect version (robust via python)
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python - << 'PY'
          import re
          from pathlib import Path
          p = Path("7.opena19_whatsapp/app/main.py").read_text(encoding="utf-8", errors="ignore")
          m = re.search(r'"version"\s*:\s*"([^"]+)"', p)
          if not m:
              raise SystemExit("Could not detect version from main.py")
          print(m.group(1))
          PY
          )"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Build Docker image (production)
        run: |
          set -euo pipefail
          cd "${DIST_DIR}"
          docker build -t "${IMAGE_NAME}:${{ steps.version.outputs.VERSION }}" .
          docker tag "${IMAGE_NAME}:${{ steps.version.outputs.VERSION }}" "${IMAGE_NAME}:latest"

      - name: Image size check
        run: |
          set -euo pipefail
          docker images "${IMAGE_NAME}"

  # ========================================
  # DEPLOYMENT READINESS REPORT
  # ========================================
  deploy-ready:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ lint, python-check, docker-build, api-test ]
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment prerequisites
        run: |
          set -euo pipefail
          cat > /tmp/deployment_report.md << EOF
          === opena19 Deployment Readiness ===

          ✅ Code Quality: PASSED
          ✅ Docker Build: PASSED
          ✅ API Tests: PASSED

          ## Endpoints Verified
          - GET /health
          - GET /api/status
          - GET /api/info
          - GET / (UI)
          - GET /workflows

          ## Configuration
          - Port: ${PORT}
          - Host: 0.0.0.0
          - Status: READY FOR PRODUCTION
          EOF
          cat /tmp/deployment_report.md

      - name: Create deployment comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/deployment_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 opena19 Deployment Ready\n\n${report}`
            });

  # ========================================
  # SUMMARY
  # ========================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [ lint, python-check, docker-build, api-test, metrics ]
    steps:
      - name: Print summary
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║   opena19 CI/CD Pipeline Complete      ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ ✅ Lint & Code Quality                ║"
          echo "║ ✅ Python Syntax Check                ║"
          echo "║ ✅ Docker Build                       ║"
          echo "║ ✅ API Endpoint Tests                 ║"
          echo "║ ✅ Code Metrics                       ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "📊 Deployment Status: READY"
          echo "🔗 GitHub: ${{ github.server_url }}/${{ github.repository }}"
          echo "📝 Commit: ${{ github.sha }}"
