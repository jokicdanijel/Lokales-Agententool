version: "3.8"

services:
  opena7:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opena7-mail
    ports:
      - "127.0.0.1:12350:12350"
    environment:
      - OPENA7_PORT=12350
      - OPENA1_URL=http://opena1:12344
      - OPENA2_URL=http://opena2:12345
      - MAIL_IMAP_HOST=${MAIL_IMAP_HOST:-imap.provider.at}
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-smtp.provider.at}
      - MAIL_USER=${MAIL_USER:-bot@example.org}
      - MAIL_PASS_ENVKEY=${MAIL_PASS_ENVKEY:-ENV:MAIL_PASS_TOKEN}
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./archivp:/app/archivp
      - ./app:/app/app
    networks:
      - portier_net
    restart: unless-stopped
    depends_on:
      - opena1
      - opena2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12350/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  opena1:
    image: ${OPENA1_IMAGE:-localhost:5000/opena1:latest}
    container_name: opena1-coordinator
    ports:
      - "127.0.0.1:12344:12344"
    networks:
      - portier_net
    restart: unless-stopped

  opena2:
    image: ${OPENA2_IMAGE:-localhost:5000/opena2:latest}
    container_name: opena2-archivator
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./archivp:/app/archivp
    networks:
      - portier_net
    restart: unless-stopped

networks:
  portier_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
