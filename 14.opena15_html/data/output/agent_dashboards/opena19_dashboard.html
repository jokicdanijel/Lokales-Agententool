<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocks & Crypto - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header h1 { color: #333; margin-bottom: 10px; }
        .badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            background: #667eea;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .info-card {
            background: #f9fafb;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .info-card h3 { color: #667eea; font-size: 0.9em; margin-bottom: 10px; }
        .info-card .value { color: #333; font-size: 1.5em; font-weight: bold; }
        .controls {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Stocks & Crypto</h1>
            <span class="badge">Data Agent</span>

            <div class="info-grid">
                <div class="info-card">
                    <h3>Agent ID</h3>
                    <div class="value">opena19</div>
                </div>
                <div class="info-card">
                    <h3>Port</h3>
                    <div class="value">12365</div>
                </div>
                <div class="info-card">
                    <h3>Kürzel</h3>
                    <div class="value">stockcryptop</div>
                </div>
                <div class="info-card">
                    <h3>Status</h3>
                    <div class="value" id="status">Lädt...</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <h2>🎛️ Steuerung</h2>
            <button class="btn" onclick="checkHealth()">❤️ Health Check</button>
            <button class="btn" onclick="checkStatus()">📊 Status abrufen</button>
            <button class="btn" onclick="location.href='http://127.0.0.1:12349'">🏠 Zum Dashboard</button>
            <button class="btn" onclick="location.href='http://127.0.0.1:12365/health'">🔗 Direkt öffnen</button>
        </div>

        <div class="controls">
            <h2>📝 Response</h2>
            <pre id="response" style="background: #1e293b; color: #e2e8f0; padding: 20px; border-radius: 10px; min-height: 100px;"></pre>
        </div>
    </div>

    <script>
        async function checkHealth() {
            const response = document.getElementById('response');
            response.textContent = 'Prüfe Health-Status...';
            try {
                const res = await fetch('http://127.0.0.1:12365/health');
                const data = await res.json();
                response.textContent = JSON.stringify(data, null, 2);
                document.getElementById('status').textContent = data.status || 'OK';
            } catch(e) {
                response.textContent = 'Fehler: ' + e.message;
                document.getElementById('status').textContent = 'Offline';
            }
        }

        async function checkStatus() {
            const response = document.getElementById('response');
            response.textContent = 'Rufe Status ab...';
            try {
                const res = await fetch('http://127.0.0.1:12365/status');
                const data = await res.json();
                response.textContent = JSON.stringify(data, null, 2);
            } catch(e) {
                response.textContent = 'Fehler: ' + e.message;
            }
        }

        window.addEventListener('load', checkHealth);
    </script>
</body>
</html>
