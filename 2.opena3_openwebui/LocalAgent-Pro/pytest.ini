[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=src
    --cov-report=html:htmlcov
    --cov-report=term-missing

markers =
    unit: Unittest
    integration: Integrationtest
    slow: Slow running tests
    smoke: Smoke tests
