version: '3.8'

services:
  # ============================================================================
  # INFRASTRUCTURE
  # ============================================================================

  postgres:
    image: postgres:16-alpine
    container_name: eden-postgres
    environment:
      POSTGRES_DB: eden
      POSTGRES_USER: eden_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eden_user -d eden"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eden-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eden-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change_me_in_production}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eden-network
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.15
    container_name: eden-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
    networks:
      - eden-network
    restart: unless-stopped

  # ============================================================================
  # CORE SERVICES
  # ============================================================================

  opena1:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.agent
      args:
        AGENT_ID: opena1
    container_name: eden-opena1
    ports:
      - "12344:12344"
    environment:
      AGENT_ID: opena1
      PORT: 12344
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eden
      DB_USER: eden_user
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_in_production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eden-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12344/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  opena2:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.agent
      args:
        AGENT_ID: opena2
    container_name: eden-opena2
    ports:
      - "12345:12345"
    environment:
      AGENT_ID: opena2
      PORT: 12345
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eden
      DB_USER: eden_user
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_in_production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eden-network
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: auth
    container_name: eden-auth
    ports:
      - "12370:12370"
    environment:
      PORT: 12370
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eden
      DB_USER: eden_user
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_in_production}
      SECRET_KEY: ${AUTH_SECRET_KEY:-generate_secure_key_in_production}
      TRIAL_DAYS: 7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eden-network
    restart: unless-stopped

  billing:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: billing
    container_name: eden-billing
    ports:
      - "12371:12371"
    environment:
      PORT: 12371
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eden
      DB_USER: eden_user
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      AUTH_SERVICE_URL: http://auth:12370
    depends_on:
      - postgres
      - auth
    networks:
      - eden-network
    restart: unless-stopped

  website:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE_NAME: website
    container_name: eden-website
    ports:
      - "12372:12372"
    environment:
      PORT: 12372
      DOMAIN: hyperdashboard-one.de
    networks:
      - eden-network
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.agent
      args:
        AGENT_ID: opena20
    container_name: eden-dashboard
    ports:
      - "12349:12349"
    environment:
      AGENT_ID: opena20
      PORT: 12349
      OPENA1_URL: http://opena1:12344
      AUTH_SERVICE_URL: http://auth:12370
    depends_on:
      - opena1
      - auth
    networks:
      - eden-network
    restart: unless-stopped

  workflow:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.agent
      args:
        AGENT_ID: opena21
    container_name: eden-workflow
    ports:
      - "12368:12368"
    environment:
      AGENT_ID: opena21
      PORT: 12368
      OPENA1_URL: http://opena1:12344
      OPENA2_URL: http://opena2:12345
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: eden
      DB_USER: eden_user
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    depends_on:
      - postgres
      - opena1
      - opena2
    networks:
      - eden-network
    restart: unless-stopped

  # ============================================================================
  # PROXY & SSL
  # ============================================================================

  nginx:
    image: nginx:alpine
    container_name: eden-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - website
      - dashboard
      - auth
      - billing
    networks:
      - eden-network
    restart: unless-stopped

  # ============================================================================
  # MONITORING
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: eden-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - eden-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: eden-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - eden-network
    restart: unless-stopped

# ============================================================================
# NETWORKS & VOLUMES
# ============================================================================

networks:
  eden-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  vault_data:
  vault_logs:
  prometheus_data:
  grafana_data:
  nginx_logs:
