default_language_version:
  python: python3.12

default_stages: [pre-commit]

fail_fast: true

exclude: |
  (?x)^(archivp_store/|\.venv/|\.venv-precommit/|venv/|dist/|build/|open-webui-0\.6\.40/|^start/|^1\.opena1&2_portier/knowledgebase/|^3\.opena4_telegram/archivp/|^artifacts/|^build/|(.*/)?artifacts/|(.*/)?\.vscode/|(.*/)?knowledgebase/|(.*/)?archivp/|.*\.min\.(js|css)$)

repos:
  # Basic hygiene (fast, staged files only)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json

  # Python linting (ruff) - staged-only, auto-fix enabled
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # GitHub Actions / Workflows: actionlint (lint only)
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        files: ^\.github/workflows/.*\.(ya?ml)$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # Local policy gates (system hooks) - run on staged content
  - repo: local
    hooks:
      - id: policy-port-range
        name: "policy: forbid 8080 & enforce host ports 12344-12399"
        entry: python3.12 scripts/policy/ports.py
        language: system
        pass_filenames: false

      - id: policy-html-only
        name: "policy: HTML-only (no JS/CSS) for app pages"
        entry: python3.12 scripts/policy/html_only.py
        language: system
        pass_filenames: false

      - id: policy-no-agent-ports-in-ui
        name: "policy: UI must not link to agent ports"
        entry: python3.12 scripts/policy/no_agent_ports_in_ui.py
        language: system
        pass_filenames: false
