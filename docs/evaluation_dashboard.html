<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELION Evaluation Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        header h1 { font-size: 28px; margin-bottom: 10px; }
        header p { color: #b0b0b0; margin: 5px 0; }

        .score-badge {
            display: inline-block;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 20px auto;
            border: 3px solid currentColor;
        }

        .score-badge.production-ready {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: #fff;
        }

        .score-badge.review {
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            color: #000;
        }

        .score-badge.staging {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: #fff;
        }

        .score-badge.dev-only {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #fff;
        }

        .readiness-label {
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 16px;
            margin: 0;
        }

        .card-score {
            font-size: 24px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
        }

        .card-score.pass { color: #4ade80; }
        .card-score.warn { color: #facc15; }
        .card-score.fail { color: #ef4444; }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            transition: width 0.5s ease;
        }

        .progress-fill.warn { background: linear-gradient(90deg, #facc15, #eab308); }
        .progress-fill.fail { background: linear-gradient(90deg, #ef4444, #dc2626); }

        .checks-list {
            margin-top: 12px;
        }

        .check {
            padding: 8px;
            margin: 4px 0;
            border-radius: 6px;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.03);
        }

        .check.pass::before { content: "✅ "; }
        .check.fail::before { content: "❌ "; }

        .check.fail {
            color: #ff8a8a;
            border-left: 3px solid #ef4444;
            padding-left: 12px;
        }

        .action-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .action-panel h2 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .action-list {
            list-style: none;
        }

        .action-list li {
            padding: 12px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border-left: 3px solid #3b82f6;
        }

        .action-list li strong {
            color: #fbbf24;
        }

        .footer {
            text-align: center;
            color: #808080;
            font-size: 12px;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .summary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .summary-stat {
            display: inline-block;
            margin: 0 20px;
        }

        .summary-stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #4ade80;
        }

        .summary-stat-label {
            font-size: 12px;
            color: #b0b0b0;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 ELION Hyper-Dashboard Evaluation Report</h1>
            <p>Workspace Production-Readiness Assessment</p>
            <p id="timestamp"></p>

            <div style="margin-top: 20px;" id="scoreContainer"></div>
        </header>

        <div class="summary">
            <div class="summary-stat">
                <div class="summary-stat-value" id="overallScore">--</div>
                <div class="summary-stat-label">Overall Score</div>
            </div>
            <div class="summary-stat">
                <div class="summary-stat-value" id="passedChecks">--</div>
                <div class="summary-stat-label">Checks Passed</div>
            </div>
            <div class="summary-stat">
                <div class="summary-stat-value" id="failedChecks">--</div>
                <div class="summary-stat-label">Checks Failed</div>
            </div>
        </div>

        <div class="action-panel" id="actionPanel"></div>

        <div class="grid" id="grid"></div>

        <div class="footer">
            <p>ELION Evaluation Framework v1.1 | Last Updated: <span id="footerTime"></span></p>
            <p>Full report: <code>workspace_evaluation_report.json</code></p>
        </div>
    </div>

    <script>
        // Try to load the actual JSON report if available (via AJAX/fetch in a real app)
        // For now, we'll use placeholder data

        const mockReport = {
            overall_score: 72.73,
            readiness_level: "STAGING_READY",
            readiness_emoji: "🔶",
            timestamp: new Date().toISOString(),
            passed_checks: 18,
            failed_checks: 6,
            categories: [
                {
                    category: "Policy & Governance",
                    score: 50.0,
                    passed_checks: 2,
                    total_checks: 4,
                    checks: [
                        { name: "No 8080", passed: false, detail: "" },
                        { name: ".env not world-readable", passed: false, detail: "" }
                    ]
                },
                {
                    category: "Python Environment",
                    score: 25.0,
                    passed_checks: 1,
                    total_checks: 4,
                    checks: [
                        { name: "pydantic in requirements", passed: false, detail: "" },
                        { name: "pydantic-settings in requirements", passed: false, detail: "" },
                        { name: "fastapi in requirements", passed: false, detail: "" }
                    ]
                },
                {
                    category: "Infrastructure & Operations",
                    score: 100.0,
                    passed_checks: 4,
                    total_checks: 4,
                    checks: []
                },
                {
                    category: "Configuration & Secrets",
                    score: 75.0,
                    passed_checks: 3,
                    total_checks: 4,
                    checks: [
                        { name: "No placeholders", passed: false, detail: "" }
                    ]
                },
                {
                    category: "Code Quality & Standards",
                    score: 100.0,
                    passed_checks: 3,
                    total_checks: 3,
                    checks: []
                },
                {
                    category: "Documentation & Accessibility",
                    score: 100.0,
                    passed_checks: 2,
                    total_checks: 2,
                    checks: []
                },
                {
                    category: "Deployment Readiness",
                    score: 100.0,
                    passed_checks: 3,
                    total_checks: 3,
                    checks: []
                }
            ]
        };

        function scoreClass(score) {
            if (score >= 90) return "pass";
            if (score >= 75) return "warn";
            return "fail";
        }

        function renderReport(report) {
            // Score badge
            const badgeClass = report.readiness_level === "PRODUCTION_READY" ? "production-ready" :
                              report.readiness_level === "PRODUCTION_READY_WITH_REVIEW" ? "review" :
                              report.readiness_level === "STAGING_READY" ? "staging" : "dev-only";

            document.getElementById("scoreContainer").innerHTML = `
                <div class="score-badge ${badgeClass}">
                    ${Math.round(report.overall_score)}%
                </div>
                <div class="readiness-label">${report.readiness_emoji} ${report.readiness_level.replace(/_/g, ' ')}</div>
            `;

            // Summary stats
            document.getElementById("overallScore").textContent = report.overall_score + "%";
            document.getElementById("passedChecks").textContent = report.passed_checks;
            document.getElementById("failedChecks").textContent = report.failed_checks;

            // Timestamp
            const ts = new Date(report.timestamp);
            document.getElementById("timestamp").textContent = ts.toLocaleString('de-DE');
            document.getElementById("footerTime").textContent = ts.toLocaleString('de-DE');

            // Category cards
            const grid = document.getElementById("grid");
            grid.innerHTML = report.categories.map(cat => {
                const progressClass = scoreClass(cat.score);
                const failedChecks = cat.checks.filter(c => !c.passed);

                return `
                    <div class="card">
                        <div class="card-header">
                            <h3>${cat.category}</h3>
                            <div class="card-score ${progressClass}">${cat.score}%</div>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill ${progressClass}" style="width: ${cat.score}%"></div>
                        </div>
                        <p style="font-size: 12px; color: #b0b0b0;">${cat.passed_checks}/${cat.total_checks} Checks bestanden</p>
                        ${failedChecks.length > 0 ? `
                            <div class="checks-list">
                                ${failedChecks.map(c => `<div class="check fail">${c.name}${c.detail ? ` – ${c.detail}` : ''}</div>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            // Action panel
            const failedCats = report.categories.filter(c => c.score < 100);
            if (failedCats.length > 0) {
                let actionHtml = `<h2>🔧 Recommended Actions</h2><ul class="action-list">`;
                failedCats.forEach(cat => {
                    cat.checks.filter(c => !c.passed).forEach(check => {
                        let action = "";
                        if (check.name.includes("8080")) action = "Remove port 8080 from all config files";
                        else if (check.name.includes("pydantic")) action = "Add pydantic/pydantic-settings to requirements.txt";
                        else if (check.name.includes("placeholder")) action = "Fill in .env with real values (no placeholders)";
                        else if (check.name.includes("world-readable")) action = "Run: chmod 600 .env";
                        else action = `Fix: ${check.name}`;

                        if (action) {
                            actionHtml += `<li><strong>${cat.category}:</strong> ${action}</li>`;
                        }
                    });
                });
                actionHtml += `</ul>`;
                document.getElementById("actionPanel").innerHTML = actionHtml;
            } else {
                document.getElementById("actionPanel").innerHTML = `<h2>✅ All Systems Go!</h2><p>No actions required. System is production-ready.</p>`;
            }
        }

        // Render on load
        document.addEventListener('DOMContentLoaded', () => {
            renderReport(mockReport);
        });
    </script>
</body>
</html>
