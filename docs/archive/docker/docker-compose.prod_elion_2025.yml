version: "3.9"

services:
  # ====================================================================
  # MONITORING STACK
  # ====================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-elion
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./configs/alert_rules.yaml:/etc/prometheus/alert_rules.yaml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - elion
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-elion
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana-dashboard-overview.json:/etc/grafana/provisioning/dashboards/overview.json:ro
      - ./configs/grafana-dashboard-services.json:/etc/grafana/provisioning/dashboards/services.json:ro
      - ./configs/grafana-dashboard-archive.json:/etc/grafana/provisioning/dashboards/archive.json:ro
      - ./configs/grafana-dashboard-performance.json:/etc/grafana/provisioning/dashboards/performance.json:ro
      - ./configs/grafana-dashboard-alerts.json:/etc/grafana/provisioning/dashboards/alerts.json:ro
    networks:
      - elion
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ====================================================================
  # CORE SERVICES (4 always running)
  # ====================================================================

  portier:
    build:
      context: .
      dockerfile: src/services/portier/Dockerfile
    container_name: portier
    ports:
      - "12344:12344"
    environment:
      - SERVICE_NAME=portier
      - PORT=12344
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src/services/portier:/app
      - ./19.opena20_dashboard_agent/metrics_exporter.py:/app/metrics_exporter.py:ro
    networks:
      - elion
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12344/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  archivator:
    build:
      context: .
      dockerfile: src/services/archivator/Dockerfile
    container_name: archivator
    ports:
      - "12345:12345"
    environment:
      - SERVICE_NAME=archivator
      - PORT=12345
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src/services/archivator:/app
      - ./1.opena1&2_portier/archivp_store:/data/archive
    networks:
      - elion
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12345/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  telegram:
    build:
      context: .
      dockerfile: src/services/telegram/Dockerfile
    container_name: telegram
    ports:
      - "12346:12346"
    environment:
      - SERVICE_NAME=telegram
