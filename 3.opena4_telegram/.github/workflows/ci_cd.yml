name: CI/CD – opena4_telegram Enterprise

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deployment"
        required: false
        default: "false"

env:
  SERVICE_NAME: opena4_telegram
  PORT: 12346
  PYTHON_VERSION: "3.13"
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_PATH: "/opt/portier/agents/opena4"
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
  VERSION_FILE: ".version"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/opena4_telegram

jobs:
  security-scan:
    name: 🛡️ Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: 📋 Upload Security Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  build-test-lint:
    name: 🧪 Build, Test & Lint
    runs-on: ubuntu-latest
    needs: security-scan

    outputs:
      version: ${{ steps.version.outputs.new }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 black mypy bandit safety

      - name: 🔒 Security Audit (bandit)
        run: bandit -r . -f json -o bandit-report.json || true

      - name: 🔍 Dependency Security (safety)
        run: safety check --json --output safety-report.json || true

      - name: 🔍 Lint (flake8)
        run: flake8 . --max-line-length=120 --statistics

      - name: 🎨 Format Check (black)
        run: black --check --line-length=120 .

      - name: 🔬 Type Check (mypy)
        run: mypy . --ignore-missing-imports || true

      - name: 🧪 Run Unit Tests
        run: |
          pytest -v --cov=. --cov-report=xml --cov-report=html

      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests

      - name: 🔢 Auto Version Bump
        id: version
        run: |
          if [[ ! -f "$VERSION_FILE" ]]; then echo "1.0.0" > "$VERSION_FILE"; fi
          current=$(cat "$VERSION_FILE")
          IFS='.' read -r major minor patch <<< "$current"

          # Increment based on commit message
          if git log -1 --pretty=%B | grep -i "BREAKING CHANGE\|major:"; then
            new_version="$((major + 1)).0.0"
          elif git log -1 --pretty=%B | grep -i "feat:\|feature:"; then
            new_version="$major.$((minor + 1)).0"
          else
            new_version="$major.$minor.$((patch + 1))"
          fi

          echo "$new_version" > "$VERSION_FILE"
          echo "new=$new_version" >> $GITHUB_OUTPUT
          echo "previous=$current" >> $GITHUB_OUTPUT

      - name: 🏗️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.new }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=opena4_telegram
            org.opencontainers.image.description=PORTIER 3.0 Telegram Agent
            org.opencontainers.image.version=${{ steps.version.outputs.new }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 💾 Commit Version Bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔢 Version bump ${{ steps.version.outputs.previous }} → ${{ steps.version.outputs.new }} [skip ci]"
          file_pattern: ".version"
          commit_user_name: "PORTIER CI/CD"
          commit_user_email: "ci@portier.dev"

  integration-test:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: build-test-lint

    services:
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🧪 Run Integration Tests
        run: |
          pip install -r requirements.txt
          pytest tests/integration/ -v --tb=short
        env:
          REDIS_URL: redis://localhost:6379
          TEST_MODE: true

  release:
    name: 📦 Create GitHub Release
    needs: [build-test-lint, integration-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📝 Generate Changelog
        id: changelog
        run: |
          # Generate changelog from commit messages
          CHANGELOG=$(git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~10")..HEAD | head -20)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-test-lint.outputs.version }}
          name: 🚀 opena4_telegram v${{ needs.build-test-lint.outputs.version }}
          body: |
            ## 🎯 PORTIER 3.0 Telegram Agent Release

            **Version:** ${{ needs.build-test-lint.outputs.version }}
            **Build Time:** ${{ github.run_started_at }}
            **Commit:** ${{ github.sha }}
            **Image Digest:** ${{ needs.build-test-lint.outputs.image-digest }}

            ### 📋 Changes
            ${{ steps.changelog.outputs.changelog }}

            ### 🐳 Docker Image
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-test-lint.outputs.version }}
            ```

            ### 🚀 Quick Deploy
            ```bash
            kubectl apply -f k8s/opena4-deployment.yaml
            ```
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    name: 🎭 Deploy to Staging
    needs: [build-test-lint, integration-test]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: 🚀 Deploy to Staging
        uses: appleboy/ssh-action@v1.3.1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_KEY }}
          script: |
            # Pull new image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-test-lint.outputs.version }}

            # Stop existing container
            docker stop opena4_telegram_staging 2>/dev/null || true
            docker rm opena4_telegram_staging 2>/dev/null || true

            # Start new container
            docker run -d \
              --name opena4_telegram_staging \
              --restart unless-stopped \
              -p 12346:12346 \
              -e TELEGRAM_TOKEN="${{ secrets.TELEGRAM_TOKEN_STAGING }}" \
              -e BEARER_TOKEN="${{ secrets.BEARER_TOKEN }}" \
              -e ENV=staging \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-test-lint.outputs.version }}

            # Wait for startup
            sleep 10

            # Health check
            curl -f http://localhost:12346/health || exit 1

  deploy-production:
    name: 🏭 Deploy to Production
    needs: [release, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🚀 Blue-Green Deployment
        uses: appleboy/ssh-action@v1.3.1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            # Blue-Green Deployment Strategy
            CURRENT_COLOR=$(docker ps --format "table {{.Names}}" | grep opena4_telegram_ | grep -o "blue\|green" | head -1 || echo "green")
            NEW_COLOR=$([ "$CURRENT_COLOR" = "blue" ] && echo "green" || echo "blue")

            echo "Current: $CURRENT_COLOR, Deploying: $NEW_COLOR"

            # Pull new image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-test-lint.outputs.version }}

            # Start new container (new color)
            docker run -d \
              --name opena4_telegram_${NEW_COLOR} \
              --restart unless-stopped \
              -p $([[ "$NEW_COLOR" == "blue" ]] && echo "12349" || echo "12350"):12346 \
              -e TELEGRAM_TOKEN="${{ env.TELEGRAM_TOKEN }}" \
              -e BEARER_TOKEN="${{ env.BEARER_TOKEN }}" \
              -e ENV=production \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-test-lint.outputs.version }}

            # Wait for startup
            sleep 15

            # Health check new deployment
            NEW_PORT=$([[ "$NEW_COLOR" == "blue" ]] && echo "12349" || echo "12350")
            curl -f http://localhost:$NEW_PORT/health || exit 1

            # Switch traffic (nginx reload or load balancer update)
            # This would typically update your load balancer configuration
            echo "Traffic switched to $NEW_COLOR deployment"

            # Wait before killing old deployment
            sleep 30

            # Remove old deployment
            docker stop opena4_telegram_${CURRENT_COLOR} 2>/dev/null || true
            docker rm opena4_telegram_${CURRENT_COLOR} 2>/dev/null || true

            echo "✅ Blue-Green deployment completed successfully"

  post-deploy-verification:
    name: 🩺 Post-Deploy Health Verification
    needs: deploy-production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: ⏱️ Wait for Service Stabilization
        run: sleep 30

      - name: 🔍 Comprehensive Health Check
        run: |
          # Health endpoint
          HEALTH=$(curl -s http://${{ env.DEPLOY_HOST }}:12346/health | jq -r '.status')
          if [[ "$HEALTH" != "ok" ]]; then
            echo "❌ Health check failed: $HEALTH"
            exit 1
          fi

          # Metrics endpoint
          METRICS=$(curl -s http://${{ env.DEPLOY_HOST }}:12346/metrics)
          if [[ $? -ne 0 ]]; then
            echo "❌ Metrics endpoint failed"
            exit 1
          fi

          # Agent status
          STATUS=$(curl -s http://${{ env.DEPLOY_HOST }}:12346/status | jq -r '.agent_status')
          if [[ "$STATUS" != "active" ]]; then
            echo "❌ Agent not active: $STATUS"
            exit 1
          fi

          echo "✅ All health checks passed - deployment verified!"

      - name: 📊 Update Deployment Status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment?.id || 'manual',
              state: 'success',
              description: 'Deployment verified and healthy',
              environment_url: 'https://${{ env.DEPLOY_HOST }}:12346'
            });

  cleanup:
    name: 🧹 Cleanup Old Images
    needs: post-deploy-verification
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 🗑️ Cleanup Old Container Images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: "container"
          min-versions-to-keep: 5
          delete-only-untagged-versions: true
