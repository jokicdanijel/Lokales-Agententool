repos:
  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-ast
      - id: debug-statements

  # isort (import sorting)
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ['--profile', 'black', '--line-length', '120']

  # Black (code formatting)
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3.12
        args: ['--line-length', '120']

  # Ruff (fast linting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: [--fix, --line-length=120]
      - id: ruff-format

  # Flake8 (additional linting)
  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=120', '--extend-ignore=E203,W503,E501']
        stages: [manual]  # Run manually if needed

  # MyPy (type checking)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: ['pydantic', 'fastapi', 'httpx']
        args: ["--ignore-missing-imports", "--no-error-summary"]
        stages: [manual]  # Run manually if needed

  # Local Portier Policy Check
  - repo: local
    hooks:
      - id: portier-policy
        name: Portier Policy Check
        entry: bash 1.portier_openai/skripte/validate_portier.sh
        language: system
        pass_filenames: false
        stages: [manual]
