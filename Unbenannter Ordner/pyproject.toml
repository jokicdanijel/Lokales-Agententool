[tool.poetry]
name = "scta-system"
version = "0.1.0"
description = "Self-Contextualizing Task Agent - Distributed orchestration system with FastAPI, Redis, Postgres, Qdrant"
authors = ["Danijel <danijel@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
python = "^3.12"

# Web Framework
fastapi = "0.121.1"
uvicorn = "0.38.0"
pydantic = "2.12.4"
pydantic-settings = "2.3.3"

# Database
sqlalchemy = "2.0.23"
psycopg2-binary = "2.9.9"
alembic = "1.13.1"

# Queue & Caching
redis = "5.0.1"
celery = "5.3.4"

# Vector DB (optional)
qdrant-client = "1.7.0"

# HTTP Client
httpx = "0.25.2"
aiohttp = "3.9.1"

# Authentication
pyjwt = "2.8.1"
python-multipart = "0.0.6"

# Logging & Telemetry
structlog = "24.1.0"
python-json-logger = "2.0.7"
opentelemetry-api = "1.21.0"
opentelemetry-sdk = "1.21.0"
opentelemetry-exporter-otlp = "1.21.0"
opentelemetry-instrumentation-fastapi = "0.42b0"
opentelemetry-instrumentation-sqlalchemy = "0.42b0"
opentelemetry-instrumentation-redis = "0.42b0"

# Utilities
python-dotenv = "1.0.0"
typer = "0.9.0"
click = "8.1.7"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.3"
pytest-asyncio = "1.2.0"
pytest-cov = "4.1.0"
pytest-mock = "3.12.0"
black = "24.1.1"
ruff = "0.2.0"
mypy = "1.7.1"
isort = "5.13.2"
bandit = "1.7.5"
safety = "2.3.5"
httpx-mock = "0.3.1"

[tool.poetry.scripts]
scta-cli = "src.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# === Tool Configuration ===

[tool.black]
line-length = 120
target-version = ["py312"]
skip-string-normalization = false

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "PT", "Q", "RSE", "RUF"]
ignore = ["E501"]  # Line length handled by black
exclude = [".venv", "venv", "__pycache__", "migrations"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict = true
exclude = [".venv", "venv", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=html --cov-report=term-missing --cov-fail-under=85"
python_files = ["test_*.py", "*_test.py"]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy-sqlalchemy]
init_var_sql_type = true
