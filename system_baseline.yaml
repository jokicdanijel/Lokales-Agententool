# PORTIER 3.0 – GESETZ (Source of Truth)
# Diese Datei kodiert die verbindliche Agent-Matrix: Name/ID/Folder/Port.
# Änderungen daran sind Governance-relevant.

system:
  name: "PORTIER 3.0"
  baseline_version: "2025-12-25"
  timezone: "Europe/Vienna"

domain_policy:
  primary_domain: "hyperdashboard-one.de"
  public_domain: "www.hyperdashboard-one.de"

port_policy:
  allow_range:
    min: 12344
    max: 12399
  forbidden_ports: [8080]
  enforce_unique: true

