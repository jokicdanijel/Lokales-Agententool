    - "opena1"
    - "opena2"
  system:
    - "opena20"
    - "opena21"
  basic:
    - "opena3"
    - "opena4"
    - "opena7"
    - "opena11"
  pro:
    - "opena8"
    - "opena12"
    - "opena14"
    - "opena18"
  premium:
    - "opena6"
    - "opena9"
    - "opena15"
    - "opena16"
  ultimum:
    - "opena5"
    - "opena10"
    - "opena13"
    - "opena17"
    - "opena19"

core_agents:
  - "opena1"
  - "opena2"

system_agents:
